current_work: |
    At Lutron, I'm part of the team that works on their processors that
    serve as the brain of the lighting system. I work with C++, C, Python, 
    Golang, and Bash on multiple components primarily in the domain of 
    embedded linux and microcontroller development.

experience:
    - title: "Embedded Software Engineer"
      company: "Lutron Electronics"
      companyLink: "https://www.lutron.com"
      date: "June 2022 - Present"
      description: |
        Building high quality lighting products that <i>just work</i>.
    - title: "Systems Engineering Intern"
      company: "Extreme Networks"
      companyLink: "https://www.extremenetworks.com"
      date: "June 2021 - August 2021"
      description: |
        I was part of the OS team and worked on the OS that runs on the Access Point
        devices developed by the company. I implemented a network security module for
        a class of legacy devices still used by 20k+ customers enabling them to gain
        access to this feature and secure their networks. I mainly worked in C and
        got to design architecture for some software processes as well.
    - title: "Software Engineering Intern"
      company: "Percussion Welder"
      companyLink: "https://www.percussionwelder.com"
      date: "July 2020 - August 2020"
      description: |
        This was my first internship since I started college. It was during the summer
        after my sophomore year – which was also the year when covid hit and everything went
        remote. I worked with signal processing techniques and developed a tool to detect
        the start and end times of a weld process carried out by the percussion welder. I worked
        in Python and implemented multiple strategies including short-term fourier analysis, 
        digital filters, data-trimming methods etc.
    - title: "Teaching Assistant"
      company: "University of Rochester"
      companyLink: "https://www.rochester.edu"
      date: "January 2019 - May 2022"
      description: |
        I have been a teaching assistant since my freshman year of college. I TA'd courses
        including C/C++ programming, signals & systems, and circuits & signals. During this time,
        I designed assignments and lead lab sessions for 40+ students. It was a great experience
        that I'm glad I got to have. I found that I learned something new about a course everytime
        I TA'd it.

